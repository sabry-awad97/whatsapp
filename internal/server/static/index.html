<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Client</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-6 text-center text-green-600">WhatsApp Messenger</h1>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">
                    Phone Number
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                       id="phone" type="text" placeholder="Phone number (e.g., 201234567890)">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="message">
                    Message
                </label>
                <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                          id="message" rows="4" placeholder="Enter your message"></textarea>
            </div>
            
            <div class="flex items-center justify-between">
                <button id="sendBtn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                    Send Message
                </button>
            </div>

            <div id="status" class="mt-4 text-center hidden">
                <p class="text-sm font-semibold"></p>
            </div>

            <div class="mt-8">
                <h2 class="text-lg font-bold mb-4 text-gray-700">Received Messages</h2>
                <div id="messages" class="space-y-2 max-h-60 overflow-y-auto">
                    <!-- Messages will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        const messages = document.getElementById('messages');

        function showStatus(message, isError = false) {
            status.classList.remove('hidden');
            status.querySelector('p').textContent = message;
            status.querySelector('p').className = `text-sm font-semibold ${isError ? 'text-red-500' : 'text-green-500'}`;
            setTimeout(() => {
                status.classList.add('hidden');
            }, 3000);
        }

        function addMessage(from, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'p-3 bg-gray-50 rounded-lg';
            msgDiv.innerHTML = `
                <p class="text-sm text-gray-600 font-semibold">From: ${from}</p>
                <p class="text-gray-800">${content}</p>
            `;
            messages.prepend(msgDiv);
        }

        sendBtn.addEventListener('click', () => {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!phone || !message) {
                showStatus('Please fill in all fields', true);
                return;
            }

            const data = {
                type: 'send_message',
                phone: phone,
                content: message
            };

            ws.send(JSON.stringify(data));
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
        });

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            switch (data.type) {
                case 'send_response':
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50');
                    if (data.success) {
                        showStatus('Message sent successfully!');
                        document.getElementById('message').value = '';
                    } else {
                        showStatus(`Failed to send message: ${data.error}`, true);
                    }
                    break;
                
                case 'received_message':
                    addMessage(data.from, data.content);
                    break;
            }
        };

        ws.onclose = () => {
            showStatus('Connection lost. Please refresh the page.', true);
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
        };
    </script>
</body>
</html>
