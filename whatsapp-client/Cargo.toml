[package]
name = "whatsapp-client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
clap = { version = "4.5.26", features = ["derive"] }
colored = "3.0.0"
console = "0.15"
dialoguer = "0.11"
futures-util = "0.3"
indicatif = "0.17"
mime_guess = "2.0"
qr2term = "0.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = "0.26.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5"
